name: Connect to private VPS
description: Dedicated WireGuard peer, restricted SSH key and pinned VPS identity
inputs:
  wireguard-key:
    description: This application's dedicated WireGuard private key
    required: true
  ssh-key:
    description: This application's dedicated SSH private key
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VPS_CI_WIREGUARD_KEY: ${{ inputs.wireguard-key }}
        VPS_CI_SSH_KEY: ${{ inputs.ssh-key }}
        CONNECTION_SCRIPT: ${{ github.action_path }}/connect.sh
      run: bash "$CONNECTION_SCRIPT"
